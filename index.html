<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description" content="校园主题创意小游戏合集">
 
  <link rel="stylesheet" href="css/hub.css">
</head>
<body>
  <main class="hub-app">
    <section class="hub-home" id="hub-home">
      <div class="hero-card">
        <p class="eyebrow">CAMPUS PLAYGROUND</p>
        <img class="hero-emblem" src="assets/images/html/maintitle_s1.webp" alt="游戏盒">
        

        <button class="hub-primary" id="open-games" type="button">START</button>
    </section>
    <section class="game-picker" id="game-picker" hidden>
      <header class="picker-header"><div><p class="eyebrow">CHOOSE A GAME</p><h1>选择一款游戏！</h1><p class="picker-copy"></p></div><button class="hub-link" id="back-home" type="button">返回首页</button></header>
      <div class="game-cards">
        <article class="game-card color-card"><div class="card-art card-art-colors" aria-hidden="true"><img src="assets/images/html/1.webp" alt=""></div><div class="card-content"><p class="card-number">GAME 01</p><h2>徽常合理</h2><p>滑动棋盘，让相同颜色的校徽相遇并升级，合成金色通关。</p><a class="card-button" href="color-merge.html?from=hub">进入游戏</a></div></article>
        <article class="game-card match-card"><div class="card-art card-art-match" aria-hidden="true"><img src="assets/images/html/2.webp" alt=""></div><div class="card-content"><p class="card-number">GAME 02</p><h2>翻牌吧！</h2><p>翻开卡片，记住位置，并找出对应的一对校园照片与线描图，完成配对。</p><a class="card-button card-button-secondary" href="photo-line-match.html">开始配对</a></div></article>
        <article class="game-card stg-card"><div class="card-art card-art-stg" aria-hidden="true"><img src="assets/images/html/3.webp" alt=""></div><div class="card-content"><p class="card-number">GAME 03</p><h2>突围龙马路</h2><p>操控主角躲避弹幕，勇敢反击小作业、实验报告与期末考试吧！</p><a class="card-button card-button-secondary" href="stg.html">开始突围</a></div></article>
      </div>
      
    </section>
  </main>
  <script type="module" src="js/hub.js"></script>
</body>
</html>
