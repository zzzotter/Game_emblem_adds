<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description" content="校园主题创意小游戏合集">
  <title>校园游艺社 · 创意小游戏合集</title>
  <link rel="stylesheet" href="css/hub.css">
</head>
<body>
  <main class="hub-app">
    <section class="hub-home" id="hub-home">
      <div class="hero-card">
        <p class="eyebrow">CAMPUS PLAYGROUND</p>
        <img class="hero-emblem" src="assets/images/school-emblem/emblem-square-01.png" alt="中央财经大学校徽">
        <h1>校园游艺社</h1>
        <p class="hero-copy">把校园记忆，玩成新的创意</p>
        <button class="hub-primary" id="open-games" type="button">选择游戏</button>
    </section>
    <section class="game-picker" id="game-picker" hidden>
      <header class="picker-header"><div><p class="eyebrow">CHOOSE A GAME</p><h1>选择一款游戏</h1><p class="picker-copy">选好游戏后即可进入专属玩法页面。</p></div><button class="hub-link" id="back-home" type="button">返回首页</button></header>
      <div class="game-cards">
        <article class="game-card color-card"><div class="card-art card-art-colors" aria-hidden="true"><img src="assets/images/school-emblem/emblem-square-vivid-02.png" alt=""><img src="assets/images/school-emblem/emblem-square-vivid-03.png" alt=""><img src="assets/images/school-emblem/emblem-square-09.png" alt=""></div><div class="card-content"><p class="card-number">GAME 01</p><h2>校徽调色局</h2><p>滑动棋盘，让相同颜色的校徽相遇并升级，合成金色通关。</p><a class="card-button" href="color-merge.html?from=hub">进入游戏</a></div></article>
        <article class="game-card match-card"><div class="card-art card-art-match" aria-hidden="true"><span class="mini-card mini-photo">校园<br>照片</span><span class="match-mark">↔</span><span class="mini-card mini-line">线描<br>图</span></div><div class="card-content"><p class="card-number">GAME 02</p><h2>校园光影配对</h2><p>翻开校园照片与线描图，记住位置并找出对应的一对。</p><a class="card-button card-button-secondary" href="photo-line-match.html">开始配对</a></div></article>
        <article class="game-card stg-card"><div class="card-art card-art-stg" aria-hidden="true"><span class="stg-student">🎓</span><span class="stg-bullet">!</span><span class="stg-boss">Boss</span></div><div class="card-content"><p class="card-number">GAME 03</p><h2>龙马路突围战</h2><p>操控学生躲避弹幕，自动反击小作业、实验报告与期末考试。</p><a class="card-button card-button-secondary" href="stg.html">开始突围</a></div></article>
      </div>
      <p class="picker-footer">校园主题 · 轻松体验 · 创意编程</p>
    </section>
  </main>
  <script type="module" src="js/hub.js"></script>
</body>
</html>
